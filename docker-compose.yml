# Stack completo del backend. Los tests usan docker-compose.test.yml, no este archivo.
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env   # DATABASE_URL de Supabase, REPUTATION_API_KEY, etc.
    environment:
      # Dentro del contenedor, localhost es el propio contenedor: Ollama corre en el host.
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"   # necesario en Linux
    volumes:
      - ./data/chroma:/app/data/chroma   # embeddings sembrados en el host
