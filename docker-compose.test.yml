# Postgres efímero solo para tests. Nunca apunta a Supabase.
services:
  postgres-test:
    image: postgres:16
    ports:
      - "5433:5432"   # 5433 porque el 5432 ya lo usa un Postgres local
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: nexo_test
    # sin volumen: el estado no sobrevive entre corridas, a propósito
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexo_test"]
      interval: 2s
      timeout: 3s
      retries: 15
